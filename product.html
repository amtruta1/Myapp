<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product View - Evella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-brand">Evella</div>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link active">Product View</a>
            <a href="register.html" class="nav-link">Register</a>
            <a href="login.html" class="nav-link">Login</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="refer.html" class="nav-link">Refer Page</a>
        </nav>
    </header>

    <div class="page active">
        <h2>Product View</h2>
        <div class="product-view-container">
            <div class="product-view-img">Product Image</div>
            <div class="product-view-details">
                <h3>Evella Premium Designer Dress</h3>
                <div class="price">₹500</div>
                <p><strong>Detailed Description:</strong> High-quality fabric, comfortable fit, elegant modern design suitable for all occasions. Fully washable and durable stitching.</p>
                <div class="action-buttons">
                    <button class="btn btn-outline" onclick="alert('Added to Cart Successfully!')">Add to Cart</button>
                    <button class="btn" onclick="alert('Proceeding to Checkout!')">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
