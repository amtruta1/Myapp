<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Evella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-brand">Evella</div>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link">Product View</a>
            <a href="register.html" class="nav-link">Register</a>
            <a href="login.html" class="nav-link">Login</a>
            <a href="profile.html" class="nav-link active">Profile</a>
            <a href="refer.html" class="nav-link">Refer Page</a>
        </nav>
    </header>

    <div class="page active">
        <div class="form-container" style="max-width: 600px;">
            <div class="profile-pic">Photo</div>
            <h2>User Profile</h2>
            <div class="input-group">
                <label>Name</label>
                <input type="text" value="John Doe">
            </div>
            <div class="input-group">
                <label>Mobile</label>
                <input type="tel" value="+91 9876543210">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" value="johndoe@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" value="********">
            </div>
            <div class="input-group">
                <label>Country</label>
                <input type="text" value="India">
            </div>
            <div class="input-group">
                <label>State</label>
                <input type="text" value="Karnataka">
            </div>
            <div class="input-group">
                <label>District</label>
                <input type="text" value="Bangalore">
            </div>
            <div class="input-group">
                <label>Taluk (TQ)</label>
                <input type="text" value="Bangalore North">
            </div>
            <div class="input-group">
                <label>Village</label>
                <input type="text" value="Sample Village">
            </div>
            <div class="input-group">
                <label>Pincode</label>
                <input type="text" value="560001">
            </div>
            <button class="btn" onclick="alert('Profile Updated Successfully!')">Update Profile</button>
        </div>
    </div>
</body>
</html>
