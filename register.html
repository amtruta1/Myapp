<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Evella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-brand">Evella</div>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link">Product View</a>
            <a href="register.html" class="nav-link active">Register</a>
            <a href="login.html" class="nav-link">Login</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="refer.html" class="nav-link">Refer Page</a>
        </nav>
    </header>

    <div class="page active">
        <div class="form-container">
            <div class="circle-logo">LOGO</div>
            <h2>Register / Login</h2>
            <div class="input-group">
                <label>Refer Code (Optional)</label>
                <input type="text" placeholder="Enter refer code">
            </div>
            <div class="input-group">
                <label>Name</label>
                <input type="text" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Phone</label>
                <input type="tel" placeholder="Enter phone number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create password">
            </div>
            <button class="btn" onclick="alert('Registration Successful!')">Register</button>
            <div class="toggle-text">Already have an account? <span onclick="location.href='login.html'">Login here</span></div>
        </div>
    </div>
</body>
</html>
