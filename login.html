<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Evella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-brand">Evella</div>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="product.html" class="nav-link">Product View</a>
            <a href="register.html" class="nav-link">Register</a>
            <a href="login.html" class="nav-link active">Login</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="refer.html" class="nav-link">Refer Page</a>
        </nav>
    </header>

    <div class="page active">
        <div class="form-container">
            <div class="circle-logo">LOGO</div>
            <h2>Login / Register</h2>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>
            <button class="btn" onclick="alert('Login Successful!')">Login</button>
            <div class="toggle-text">Don't have an account? <span onclick="location.href='register.html'">Register here</span></div>
        </div>
    </div>
</body>
</html>
